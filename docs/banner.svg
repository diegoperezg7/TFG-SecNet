<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#151b2b"/>
      <stop offset="0.6" stop-color="#1b2338"/>
      <stop offset="1" stop-color="#0b6f8f"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e6fb0"/>
      <stop offset="1" stop-color="#1aa3d4"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="318" rx="23" fill="none" stroke="#1aa3d4" stroke-opacity="0.3"/>

  <!-- packets flowing into a filter -->
  <g transform="translate(60 0)">
  <g fill="#8fd8ef" fill-opacity="0.55">
    <rect x="880" y="118" width="26" height="10" rx="3"/><rect x="930" y="118" width="26" height="10" rx="3"/>
    <rect x="860" y="158" width="26" height="10" rx="3"/><rect x="910" y="158" width="26" height="10" rx="3"/><rect x="960" y="158" width="26" height="10" rx="3"/>
    <rect x="890" y="198" width="26" height="10" rx="3"/>
  </g>
  <rect x="1008" y="98" width="8" height="128" rx="4" fill="#ffffff" fill-opacity="0.85"/>
  <g fill="#ef4444"><rect x="1040" y="118" width="26" height="10" rx="3"/><rect x="1040" y="198" width="26" height="10" rx="3" fill-opacity="0.8"/></g>
  <g fill="#22c55e"><rect x="1040" y="158" width="26" height="10" rx="3"/><rect x="1090" y="158" width="26" height="10" rx="3" fill-opacity="0.8"/><rect x="1140" y="158" width="26" height="10" rx="3" fill-opacity="0.6"/></g>
  </g>

  <!-- shield -->
  <g transform="translate(70 66)">
    <path d="M94 6 L170 30 V92 C170 140 136 170 94 186 C52 170 18 140 18 92 V30 Z" fill="none" stroke="url(#shield)" stroke-width="12" stroke-linejoin="round"/>
    <rect x="70" y="86" width="48" height="40" rx="8" fill="url(#shield)"/>
    <path d="M78 86 V72 a16 16 0 0 1 32 0 V86" fill="none" stroke="url(#shield)" stroke-width="9"/>
    <circle cx="94" cy="104" r="6" fill="#151b2b"/>
  </g>

  <text x="300" y="150" font-family="Orbitron, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="6" fill="#19c2e6">SECNET</text>
  <text x="302" y="196" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c3ccdb">Network intrusion detection with automated response</text>
  <text x="302" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#7d89a0">suricata · python responder · nftables/iptables · php dashboard</text>
</svg>
